<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars in the Sky</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #050b24;
            color: white;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            color: #ffd700;
        }

        .star {
            font-size: 60px;
            margin: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            background-color: #ffd700;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: white;
        }

        #fact {
            margin-top: 20px;
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="star">⭐</div>

        <h1>Stars in the Sky</h1>

        <p>
            Stars are huge balls of hot gas, mostly made of hydrogen and helium.
            They produce light and heat through nuclear fusion in their cores.
        </p>

        <p>
            The Sun is actually a star. It looks much bigger and brighter than
            other stars because it is much closer to Earth.
        </p>

        <button onclick="showFact()">Show a Star Fact</button>

        <div id="fact"></div>

    </div>

    <script>
        function showFact() {
            document.getElementById("fact").innerHTML =
                "✨ Some stars are much larger and hotter than our Sun!";
        }
    </script>

</body>
</html>
